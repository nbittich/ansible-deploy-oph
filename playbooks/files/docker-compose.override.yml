services:
  nginx:
    image: nginx:alpine
    depends_on:
      - identifier
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
    restart: always
  mock-login:
    image: lblod/mock-login-service:0.7.0
    links:
      - database:database
    restart: "no"
  op-public-consumer:
    environment:
      DCR_SYNC_BASE_URL: "https://organisaties.abb.lblod.info"
    restart: "no"